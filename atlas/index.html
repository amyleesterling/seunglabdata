<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Follow a brain dataset from nanometer-scale imaging through alignment, segmentation, Neuroglancer, collaborative proofreading, analysis and simulation." />
    <meta property="og:title" content="Connectome Atlas — An Interactive Introduction to Connectomics" />
    <meta property="og:description" content="An interactive field guide to mapping the wired brain." />
    <meta property="og:image" content="https://connectome.quest/atlas/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/atlas/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/atlas/scifi/hologram.css" />
    <title>Connectome Atlas — An Interactive Introduction to Connectomics</title>
    <script type="module" crossorigin src="/atlas/assets/index-t8dkMKuo.js"></script>
    <link rel="stylesheet" crossorigin href="/atlas/assets/index-DVK2Xaqw.css">
    <style>
      .start-mapping-section{border-top:1px solid var(--line,#1c2733);background:radial-gradient(circle at 50% 30%,#24647426,#0000 45%),#050c10;padding:110px 0 130px;text-align:center}
      .start-mapping-section .section-index{justify-content:center}
      .start-mapping-copy{max-width:560px;margin:18px auto 0;line-height:1.7}
      .start-mapping-actions{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:34px}
      .start-mapping-btn{background:#e6c760;color:#0b0e17;font-weight:700;letter-spacing:.04em;padding:15px 38px;border-radius:999px;text-decoration:none}
      .start-mapping-btn:hover{filter:brightness(1.08)}
      .start-mapping-alt{color:#42d5ec;text-decoration:none}
      .start-mapping-alt:hover{text-decoration:underline}
      .vocab-section{padding:80px 0 90px}
      .vocab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:10px}
      .vocab-item{border:1px solid var(--line,#1c2733);background:#070d13;border-radius:10px;padding:16px 18px}
      .vocab-item b{color:#42d5ec;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
      .vocab-item p{margin:8px 0 0;font-size:14px;line-height:1.55;opacity:.85}
      .human-brain-section{padding:110px 0;border-top:1px solid var(--line,#1c2733);background:radial-gradient(circle at 50% 20%,#24647420,#0000 45%),#050c10}
      .human-brain-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
      @media(max-width:860px){.human-brain-grid{grid-template-columns:1fr}}
      .human-brain-panel{margin:0;border:1px solid var(--line,#1c2733);border-radius:12px;overflow:hidden;background:#04080c}
      .human-brain-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;font:10px/1 var(--font-geist-mono),monospace;letter-spacing:.18em;text-transform:uppercase}
      .human-brain-bar a{color:#42d5ec;text-decoration:none;white-space:nowrap}
      .human-brain-bar a:hover{text-decoration:underline}
      .human-brain-panel iframe{width:100%;height:460px;border:0;display:block;background:#000}
      .human-brain-panel figcaption{padding:12px 14px;font-size:13px;line-height:1.5;opacity:.8}
      .human-brain-bridge{margin-top:26px;text-align:center}
      .human-brain-bridge a{color:#42d5ec;text-decoration:none}
      .human-brain-bridge a:hover{text-decoration:underline}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/atlas/scifi/hologram.js" defer></script>
    <script src="/atlas/scifi/hologram-tap.js" defer></script>
  </body>
</html>
