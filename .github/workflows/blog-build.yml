# Builds the blog's static pages, sitemap, feed and crawler files from the
# published posts (tools/build-blog.mjs), and publishes them when they change.
# Posts are written in Pyr, so this runs on a timer instead of on a push.
name: Blog Build

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the blog pages
        run: node tools/build-blog.mjs

      # A copy of every published post and its uploaded pictures (backup/blog).
      - name: Back up the blog
        run: node tools/backup-blog.mjs

      - name: Publish what changed
        id: publish
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "blog-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog backup sitemap.xml robots.txt llms.txt
          git commit -m "Blog: pages rebuilt from the published posts"
          # someone may have pushed meanwhile
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      # New posts by email (ng-extend functions/blog-mail.js, ewBlogMail). The
      # function holds the key and decides everything: each post goes once,
      # only after its page is live. This only says "look now", every run, so
      # a post whose page was not live yet is picked up next time. After a
      # push it first waits for GitHub Pages. It never fails the build.
      - name: Email new posts
        if: always()
        run: |
          if [ "${{ steps.publish.outputs.pushed }}" = "1" ]; then sleep 90; fi
          curl -sS -m 60 -X POST https://us-central1-eyewire-ii-e4d52.cloudfunctions.net/ewBlogMail -H 'Content-Type: application/json' -d '{"action":"check"}' || true
