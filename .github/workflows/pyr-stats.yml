# Refreshes "Pyr by the numbers" on connectome.quest/pyr/ (commits, updates
# sent live, weekly chart) from GitHub's public record for seung-lab/ng-extend.
# Runs Monday mornings; publishes only when the numbers changed.
name: Pyr Stats

on:
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pyr-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Count commits and updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/pyr-stats.mjs

      - name: Publish what changed
        run: |
          if [ -z "$(git status --porcelain pyr/index.html)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "pyr-stats"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyr/index.html
          git commit -m "What is Pyr?: weekly numbers refreshed"
          git pull --rebase origin main
          git push origin HEAD:main
