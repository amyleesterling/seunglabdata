<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Play, Map the Brain</title>
  <meta name="description" content="Map real neurons in the EyeWire II community branch of Neuroglancer: real electron microscopy, real segmentation, and a path into citizen neuroscience." />
  <link rel="icon" type="image/png" href="/assets/images/favicon-pyr.png" />
  <link rel="apple-touch-icon" href="/assets/images/favicon-pyr.png" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; }
    .play-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      border: 0;
      display: block;
    }
    .play-hint {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: min(560px, calc(100vw - 32px));
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid rgba(66, 213, 236, .35);
      background: rgba(5, 12, 16, .92);
      color: #dfe9ee;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .5);
      z-index: 10;
      transition: opacity .6s ease;
    }
    .play-hint.hide { opacity: 0; pointer-events: none; }
    .play-hint b { color: #42d5ec; font-weight: 600; }
    .play-hint button {
      flex: none;
      border: 0;
      background: none;
      color: #9fb3bd;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
    }
    .play-hint button:hover { color: #fff; }
  </style>
</head>
<body>
  <iframe
    class="play-frame"
    src="https://eyewire-ii-community-dot-brain-wire-dot-seung-lab.ue.r.appspot.com/"
    title="EyeWire II community Neuroglancer workspace"
    allow="fullscreen"
    loading="eager"></iframe>

  <div class="play-hint" id="playHint" role="status">
    <span>If the viewer asks for a login through <b>global.daf-apis.com</b>, that is the data server. Choose <b>Sign in with Google</b> and you are in.</span>
    <button id="playHintClose" type="button" aria-label="Dismiss">&#10005;</button>
  </div>

  <script>
    (function () {
      var hint = document.getElementById('playHint');
      var close = document.getElementById('playHintClose');
      function hide() { hint.classList.add('hide'); }
      close.addEventListener('click', hide);
      setTimeout(hide, 15000);
    })();
  </script>
</body>
</html>
